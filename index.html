<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Countdown Tahun Baru 2026</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Countdown Tahun Baru 2026</h1>

        <section class="countdown-panel">
            <div class="countdown" id="countdown">
                <div class="time-box"><span id="days">0</span><small>Hari</small></div>
                <div class="time-box"><span id="hours">0</span><small>Jam</small></div>
                <div class="time-box"><span id="minutes">0</span><small>Menit</small></div>
                <div class="time-box"><span id="seconds">0</span><small>Detik</small></div>
            </div>

            <div class="clock-and-digital">
                <div class="clock" id="analogClock" aria-hidden="true">
                    <div class="dial">
                        <div class="mark mark1"></div>
                        <div class="mark mark2"></div>
                        <div class="mark mark3"></div>
                        <div class="mark mark4"></div>
                    </div>
                    <div class="hand hour" id="hourHand"></div>
                    <div class="hand minute" id="minuteHand"></div>
                    <div class="hand second" id="secondHand"></div>
                    <div class="center-dot"></div>
                </div>

                <div class="digital">
                    <div id="digitalTime">--:--:--</div>
                    <div class="note">Waktu Lokal</div>
                </div>
            </div>
        </section>

        <footer>
            <small>Diperbarui setiap detik - Selamat Tahun Baru 2026!</small>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
